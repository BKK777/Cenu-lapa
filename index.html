<!DOCTYPE html>
<html lang="lv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cenu lapa</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f4f6;
            color: #1f2937;
        }

        .main {
            max-width: 1500px;
            margin: auto;
            padding: 30px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }

        input[type="file"] {
            padding: 10px;
        }

        #search {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 10px 18px;
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .tab.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #e5e7eb;
            padding: 10px;
            text-align: left;
            white-space: nowrap;
            position: sticky;
            top: 0;
        }

        td {
            padding: 9px 10px;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }

        td.number,
        th.number {
            text-align: right;
        }

        tbody tr:hover td {
            background: #f9fafb;
        }

        /*
        AKCIJAS KOLONNA

        !important ir speciāli,
        lai hover efekts nepārkrāso
        dzelteno kolonnu.
        */

        th.akcija-column {
            background: #f6d365 !important;
            font-weight: bold;
        }

        td.akcija-column {
            background: #fff3a3 !important;
            font-weight: bold;
        }

        tbody tr:hover td.akcija-column {
            background: #ffe875 !important;
        }

        .discount {
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        .info {
            margin-top: 10px;
            color: #6b7280;
            font-size: 14px;
        }

        .error {
            margin-top: 15px;
            padding: 12px;
            background: #fef2f2;
            color: #991b1b;
            border-radius: 7px;
        }

        .count {
            margin-bottom: 12px;
            color: #6b7280;
            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="main">

    <h1>Cenu lapa</h1>

    <div class="subtitle">
        Automātiska cenu lapas izveide no List1
    </div>


    <!-- FILE UPLOAD -->

    <div class="card">

        <strong>Izvēlies Excel failu</strong>

        <br><br>

        <input
            type="file"
            id="excelFile"
            accept=".xlsx,.xls"
        >

        <div
            id="fileInfo"
            class="info">
        </div>

        <div id="error"></div>

    </div>


    <!-- CONTENT -->

    <div
        id="content"
        class="hidden">


        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab active"
                data-category="supplements">

                Uztura bagātinātāji

            </button>

            <button
                class="tab"
                data-category="cosmetics">

                Kosmētika

            </button>

            <button
                class="tab"
                data-category="pets">

                Mājdzīvnieki

            </button>

        </div>


        <!-- SEARCH -->

        <div class="card">

            <input
                id="search"
                type="text"
                placeholder="Meklēt produktu vai artikulu..."
            >

        </div>


        <!-- TABLE -->

        <div class="card">

            <div
                id="productCount"
                class="count">
            </div>

            <div class="table-wrapper">

                <table>

                    <thead>

                    <tr>

                        <th>
                            Art.
                        </th>

                        <th>
                            Produkts
                        </th>

                        <th>
                            Daudzums
                        </th>

                        <th class="number">
                            Cena
                        </th>

                        <th class="number akcija-column">
                            Akcija
                        </th>

                        <th class="number">
                            Atlaide
                        </th>

                        <th class="number">
                            Atlaide %
                        </th>

                        <th class="number">
                            Pietiek MIN
                        </th>

                        <th class="number">
                            Pietiek MAX
                        </th>

                        <th>
                            IDD MIN
                        </th>

                        <th>
                            IDD MAX
                        </th>

                    </tr>

                    </thead>

                    <tbody id="productRows">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

/*
==================================================
GLOBAL DATA
==================================================
*/

let allProducts = [];

let currentCategory = "supplements";


/*
==================================================
UPLOAD
==================================================
*/

document
    .getElementById("excelFile")
    .addEventListener(
        "change",
        readExcel
    );


async function readExcel(event) {

    const file =
        event.target.files[0];


    if (!file) {
        return;
    }


    try {

        const arrayBuffer =
            await file.arrayBuffer();


        const workbook =
            XLSX.read(
                arrayBuffer,
                {
                    type: "array"
                }
            );


        /*
        Mēs lasām tikai List1
        */

        const sheet =
            workbook.Sheets["List1"];


        if (!sheet) {

            throw new Error(
                'Excel failā nav atrasta lapa "List1".'
            );

        }


        const rows =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    defval: "",
                    raw: true
                }
            );


        processData(rows);


        document
            .getElementById("fileInfo")
            .textContent =

            file.name +
            " — nolasītas " +
            rows.length +
            " rindas";


        document
            .getElementById("error")
            .innerHTML = "";


        document
            .getElementById("content")
            .classList
            .remove("hidden");


        renderTable();

    }

    catch(error) {

        document
            .getElementById("content")
            .classList
            .add("hidden");


        document
            .getElementById("error")
            .innerHTML =

            '<div class="error">' +
            error.message +
            '</div>';

    }

}


/*
==================================================
PROCESS DATA
==================================================
*/

function processData(rows) {

    allProducts = [];


    rows.forEach(row => {


        /*
        Kategoriju vairs nemeklējam tikai
        kolonnā "Group".

        Pārbaudām VISAS rindas vērtības.
        */

        const rowText =
            Object
                .values(row)
                .map(value =>
                    String(value)
                        .toLowerCase()
                        .trim()
                )
                .join(" | ");


        let category = null;


        /*
        UZTURA BAGĀTINĀTĀJI
        */

        if (

            rowText.includes(
                "uztura bagātināt"
            )

            ||

            rowText.includes(
                "supplement"
            )

        ) {

            category =
                "supplements";

        }


        /*
        KOSMĒTIKA
        */

        else if (

            rowText.includes(
                "kosmēt"
            )

            ||

            rowText.includes(
                "cosmetic"
            )

        ) {

            category =
                "cosmetics";

        }


        /*
        MĀJDZĪVNIEKI
        */

        else if (

            rowText.includes(
                "mājdzīv"
            )

            ||

            rowText.includes(
                "pet"
            )

        ) {

            category =
                "pets";

        }


        /*
        Ja kategorija nav atrasta,
        šo rindu neizmantojam.
        */

        else {

            return;

        }


        /*
        ARTICLE
        */

        const art =
            findValue(
                row,
                [
                    "Art. No.",
                    "Art No",
                    "Art.",
                    "Article",
                    "Artikel"
                ]
            );


        /*
        PRODUCT NAME
        */

        const product =
            findValue(
                row,
                [
                    "Product Name Aesculap",
                    "Product Name",
                    "Produkts",
                    "Product"
                ]
            );


        /*
        Ja nav artikula vai produkta nosaukuma,
        rindu izlaižam.
        */

        if (
            !art ||
            !product
        ) {

            return;

        }


        /*
        REGULAR PRICE
        */

        const regularPrice =
            parseNumber(

                findValue(
                    row,
                    [
                        "Regular price",
                        "Regular price (EUR)",
                        "Cena"
                    ]
                )

            );


        /*
        CAMPAIGN PRICE
        */

        const salePrice =
            parseNumber(

                findValue(
                    row,
                    [
                        "Price (EUR)",
                        "Campaign price",
                        "Akcija"
                    ]
                )

            );


        /*
        CALCULATED DISCOUNT
        */

        const discount =
            regularPrice -
            salePrice;


        const discountPercent =

            regularPrice > 0

                ? discount /
                  regularPrice

                : 0;


        /*
        ADD PRODUCT
        */

        allProducts.push({

            category,

            art,

            product,

            content:
                findValue(
                    row,
                    [
                        "Content",
                        "Daudzums"
                    ]
                ),

            regularPrice,

            salePrice,

            discount,

            discountPercent,

            periodMin:
                findValue(
                    row,
                    [
                        "For period (months) - min",
                        "For period",
                        "Pietiek MIN"
                    ]
                ),

            periodMax:
                findValue(
                    row,
                    [
                        "For period (months) - max",
                        "Pietiek MAX"
                    ]
                ),

            iddMin:
                findValue(
                    row,
                    [
                        "RDD min",
                        "IDD MIN",
                        "IDD min"
                    ]
                ),

            iddMax:
                findValue(
                    row,
                    [
                        "RDD max",
                        "IDD MAX",
                        "IDD max"
                    ]
                )

        });

    });


    /*
    PRODUCT NAME A-Z
    */

    allProducts.sort(
        (a, b) =>

            String(a.product)
                .localeCompare(
                    String(b.product),
                    "lv"
                )
    );

}


/*
==================================================
SMART COLUMN SEARCH
==================================================
*/

function findValue(
    row,
    possibleNames
) {


    const keys =
        Object.keys(row);


    /*
    1. EXACT MATCH
    */

    for (
        const wantedName
        of possibleNames
    ) {


        const exactKey =
            keys.find(key =>

                key
                    .trim()
                    .toLowerCase()

                ===

                wantedName
                    .trim()
                    .toLowerCase()

            );


        if (
            exactKey &&
            row[exactKey] !== ""
        ) {

            return row[exactKey];

        }

    }


    /*
    2. PARTIAL MATCH

    Piemēram:
    "Product Name Aesculap (....)"
    atradīs pēc "Product Name Aesculap"
    */

    for (
        const wantedName
        of possibleNames
    ) {


        const partialKey =
            keys.find(key =>

                key
                    .trim()
                    .toLowerCase()
                    .includes(
                        wantedName
                            .trim()
                            .toLowerCase()
                    )

            );


        if (
            partialKey &&
            row[partialKey] !== ""
        ) {

            return row[partialKey];

        }

    }


    return "";

}


/*
==================================================
TABLE
==================================================
*/

function renderTable() {


    const tbody =
        document
            .getElementById(
                "productRows"
            );


    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();


    tbody.innerHTML = "";


    const products =
        allProducts.filter(product => {


            /*
            CATEGORY
            */

            if (
                product.category !==
                currentCategory
            ) {

                return false;

            }


            /*
            SEARCH
            */

            if (!search) {

                return true;

            }


            return (

                String(product.art)
                    .toLowerCase()
                    .includes(search)

                ||

                String(product.product)
                    .toLowerCase()
                    .includes(search)

            );

        });


    /*
    PRODUCT COUNT
    */

    document
        .getElementById(
            "productCount"
        )
        .textContent =

        "Produkti: " +
        products.length;


    /*
    TABLE ROWS
    */

    products.forEach(product => {


        const row =
            document.createElement(
                "tr"
            );


        row.innerHTML = `

            <td>
                ${escapeHtml(product.art)}
            </td>


            <td>
                <b>
                    ${escapeHtml(product.product)}
                </b>
            </td>


            <td>
                ${escapeHtml(product.content)}
            </td>


            <td class="number">
                ${money(product.regularPrice)}
            </td>


            <td class="number akcija-column">
                ${money(product.salePrice)}
            </td>


            <td class="number">
                ${money(product.discount)}
            </td>


            <td class="number discount">
                ${percent(product.discountPercent)}
            </td>


            <td class="number">
                ${oneDecimal(product.periodMin)}
            </td>


            <td class="number">
                ${oneDecimal(product.periodMax)}
            </td>


            <td>
                ${display(product.iddMin)}
            </td>


            <td>
                ${display(product.iddMax)}
            </td>

        `;


        tbody.appendChild(row);

    });

}


/*
==================================================
TABS
==================================================
*/

document
    .querySelectorAll(".tab")
    .forEach(button => {


        button.addEventListener(
            "click",
            function() {


                document
                    .querySelectorAll(
                        ".tab"
                    )
                    .forEach(tab =>

                        tab
                            .classList
                            .remove(
                                "active"
                            )

                    );


                this
                    .classList
                    .add(
                        "active"
                    );


                currentCategory =
                    this.dataset.category;


                renderTable();

            }
        );

    });


/*
==================================================
SEARCH
==================================================
*/

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderTable
    );


/*
==================================================
NUMBER
==================================================
*/

function parseNumber(value) {


    if (
        value === "" ||
        value === null ||
        value === undefined
    ) {

        return 0;

    }


    if (
        typeof value === "number"
    ) {

        return value;

    }


    let cleaned =
        String(value)
            .replace(/\s/g, "")
            .replace("€", "")
            .replace("%", "")
            .replace(",", ".")
            .trim();


    const number =
        Number(cleaned);


    return isNaN(number)
        ? 0
        : number;

}


/*
==================================================
EURO
==================================================
*/

function money(value) {

    return Number(value)
        .toLocaleString(
            "lv-LV",
            {
                style: "currency",
                currency: "EUR",
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}


/*
==================================================
PERCENT
==================================================
*/

function percent(value) {

    return (
        Number(value) * 100
    ).toLocaleString(
        "lv-LV",
        {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        }
    ) + "%";

}


/*
==================================================
ONE DECIMAL
==================================================
*/

function oneDecimal(value) {


    if (
        value === "" ||
        value === null ||
        value === undefined
    ) {

        return "—";

    }


    const number =
        parseNumber(value);


    return number
        .toLocaleString(
            "lv-LV",
            {
                minimumFractionDigits: 1,
                maximumFractionDigits: 1
            }
        );

}


/*
==================================================
DISPLAY
==================================================
*/

function display(value) {

    if (
        value === "" ||
        value === null ||
        value === undefined
    ) {

        return "—";

    }


    return escapeHtml(value);

}


/*
==================================================
HTML SAFETY
==================================================
*/

function escapeHtml(value) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}

</script>

</body>

</html>
