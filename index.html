<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cenu lapa</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f3f4f6;
      color: #1f2937;
    }

    .main {
      max-width: 1500px;
      margin: auto;
      padding: 30px;
    }

    h1 { margin-bottom: 5px; }

    .subtitle {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 10px 18px;
      border: 1px solid #d1d5db;
      background: white;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    #search {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 15px;
    }

    .table-wrapper { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th {
      background: #e5e7eb;
      padding: 10px;
      text-align: left;
      white-space: nowrap;
      position: sticky;
      top: 0;
    }

    td {
      padding: 9px 10px;
      border-bottom: 1px solid #e5e7eb;
      white-space: nowrap;
    }

    td.number,
    th.number {
      text-align: right;
    }

    tbody tr:hover td {
      background: #f9fafb;
    }

    th.akcija-column {
      background: #f6d365 !important;
      font-weight: bold;
    }

    td.akcija-column {
      background: #fff3a3 !important;
      font-weight: bold;
    }

    tbody tr:hover td.akcija-column {
      background: #ffe875 !important;
    }

    tr.package-row td {
      font-weight: bold;
    }

    tr.package-item td {
      background: #f8fafc;
      font-weight: normal;
    }

    tr.package-item td.product-indent {
      padding-left: 28px;
    }

    tr.package-item td.product-indent::before {
      content: "↳ ";
      color: #6b7280;
    }

    tr.package-item:hover td {
      background: #f1f5f9;
    }

    tr.package-item:hover td.akcija-column {
      background: #ffe875 !important;
    }

    .count,
    .status {
      color: #6b7280;
      font-size: 14px;
    }

    .count { margin-bottom: 12px; }

    .error {
      padding: 12px;
      border-radius: 7px;
      background: #fef2f2;
      color: #991b1b;
    }

    .hidden { display: none; }
  </style>
</head>

<body>
<div class="main">

  <h1>Cenu lapa</h1>
  <div class="subtitle">Existing 2026 Rudens</div>

  <div id="loading" class="card status">
    Ielādēju aktuālās cenas...
  </div>

  <div id="error" class="card error hidden"></div>

  <div id="content" class="hidden">

    <div class="tabs">
      <button class="tab active" data-category="supplements">Uztura bagātinātāji</button>
      <button class="tab" data-category="cosmetics">Kosmētika</button>
      <button class="tab" data-category="pets">Mājdzīvnieki</button>
    </div>

    <div class="card">
      <input id="search" type="text" placeholder="Meklēt produktu vai artikulu...">
    </div>

    <div class="card">
      <div id="productCount" class="count"></div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Art.</th>
              <th>Produkts</th>
              <th>Daudzums</th>
              <th class="number">Cena</th>
              <th class="number akcija-column">Akcija</th>
              <th>Paka</th>
              <th class="number">Atlaide</th>
              <th class="number">Atlaide %</th>

            </tr>
          </thead>
          <tbody id="productRows"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
let allProducts = [];
let currentCategory = "supplements";

loadPricing();

async function loadPricing() {
  try {
    // no-store + timestamp helps avoid showing old prices after you replace pricing.json
    const response = await fetch(
      "pricing.json?v=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error(
        "pricing.json nav atrasts. Pārliecinies, ka tas ir tajā pašā GitHub mapē kā index.html."
      );
    }

    allProducts = await response.json();

    if (!Array.isArray(allProducts)) {
      throw new Error("pricing.json formāts nav pareizs.");
    }

    document.getElementById("loading").classList.add("hidden");
    document.getElementById("content").classList.remove("hidden");

    renderTable();
  }
  catch (error) {
    document.getElementById("loading").classList.add("hidden");

    const errorBox = document.getElementById("error");
    errorBox.textContent = error.message;
    errorBox.classList.remove("hidden");
  }
}

function renderTable() {
  const tbody = document.getElementById("productRows");


  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  tbody.innerHTML = "";

  const products = allProducts.filter(product => {

    if (product.category !== currentCategory) {
      return false;
    }

    if (!search) {
      return true;
    }

    return (
      String(product.art ?? "")
        .toLowerCase()
        .includes(search)
      ||
      String(product.product ?? "")
        .toLowerCase()
        .includes(search)
    );
  });

  document.getElementById("productCount").textContent =
    "Produkti: " + products.length;

  products.forEach((product, productIndex) => {

    const regularPrice = number(product.regularPrice);
    const salePrice = number(product.salePrice);

    const discount = regularPrice - salePrice;

    const discountPercent =
      regularPrice > 0
        ? discount / regularPrice
        : 0;

    const row = document.createElement("tr");

    const isPackage = salePrice >= 20;

    if (isPackage) {
      row.classList.add("package-row");
    }

    row.innerHTML = `
      <td>${escapeHtml(product.art)}</td>

      <td>${escapeHtml(product.product)}</td>

      <td>${escapeHtml(product.content)}</td>

      <td class="number">
        ${money(regularPrice)}
      </td>

      <td class="number akcija-column">
        ${money(salePrice)}
      </td>

      <td>
        ${isPackage ? "Jā" : "Nē"}
      </td>

      <td class="number">
        ${money(discount)}
      </td>

      <td class="number">
        ${percent(discountPercent)}
      </td>

    `;

    tbody.appendChild(row);

    /*
      Pakas sastāvdaļas rādām uzreiz zem pakas kā atsevišķas rindas.
      Tām saglabājam individuālo cenu, jo tās var iegādāties arī atsevišķi.
    */
    if (
      isPackage &&
      Array.isArray(product.packageContents) &&
      product.packageContents.length > 0
    ) {

      product.packageContents.forEach(item => {

        const itemRegularPrice = number(item.regularPrice);
        const itemSalePrice = number(item.salePrice);

        const itemDiscount =
          itemRegularPrice - itemSalePrice;

        const itemDiscountPercent =
          itemRegularPrice > 0
            ? itemDiscount / itemRegularPrice
            : 0;

        const itemRow =
          document.createElement("tr");

        itemRow.className =
          "package-item";

        itemRow.innerHTML = `
          <td>
            ${escapeHtml(item.art)}
          </td>

          <td class="product-indent">
            ${escapeHtml(item.product)}
          </td>

          <td>
            ${escapeHtml(item.content)}
          </td>

          <td class="number">
            ${money(itemRegularPrice)}
          </td>

          <td class="number akcija-column">
            ${money(itemSalePrice)}
          </td>

          <td>
            ${itemSalePrice >= 20 ? "Jā" : "Nē"}
          </td>

          <td class="number">
            ${money(itemDiscount)}
          </td>

          <td class="number">
            ${percent(itemDiscountPercent)}
          </td>
        `;

        tbody.appendChild(itemRow);

      });
    }

  });
}

/*
==================================================
TABS
==================================================
*/

document
  .querySelectorAll(".tab")
  .forEach(button => {

    button.addEventListener(
      "click",
      function() {

        document
          .querySelectorAll(".tab")
          .forEach(tab =>
            tab.classList.remove("active")
          );

        this.classList.add("active");

        currentCategory =
          this.dataset.category;

        renderTable();
      }
    );

  });

document
  .getElementById("search")
  .addEventListener("input", renderTable);

function number(value) {
  if (
    value === "" ||
    value === null ||
    value === undefined
  ) {
    return 0;
  }

  if (typeof value === "number") {
    return value;
  }

  const parsed = Number(
    String(value)
      .replace(/\s/g, "")
      .replace("€", "")
      .replace(",", ".")
      .trim()
  );

  return Number.isNaN(parsed) ? 0 : parsed;
}

function money(value) {
  return Number(value).toLocaleString(
    "lv-LV",
    {
      style: "currency",
      currency: "EUR",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  );
}

function percent(value) {
  return (Number(value) * 100).toLocaleString(
    "lv-LV",
    {
      minimumFractionDigits: 0,
      maximumFractionDigits: 0
    }
  ) + "%";
}

function oneDecimal(value) {
  if (
    value === "" ||
    value === null ||
    value === undefined
  ) {
    return "—";
  }

  return number(value).toLocaleString(
    "lv-LV",
    {
      minimumFractionDigits: 1,
      maximumFractionDigits: 1
    }
  );
}

function display(value) {
  if (
    value === "" ||
    value === null ||
    value === undefined
  ) {
    return "—";
  }

  return escapeHtml(value);
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
</script>

</body>
</html>
